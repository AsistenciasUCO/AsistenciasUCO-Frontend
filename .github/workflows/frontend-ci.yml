name: Frontend CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
      - 'feature/**'
      - 'feat/**'
      - 'fix/**'
      - 'hotfix/**'
  workflow_dispatch:

jobs:
  build-test-verify:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (headless, with coverage)
        run: npm run test:ci
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Realtime coverage gate
        run: npm run coverage:realtime:check

      - name: Trivy filesystem inventory
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          format: sarif
          output: frontend-trivy-fs.sarif
          severity: HIGH,CRITICAL
          exit-code: 0
          ignore-unfixed: false

      - name: SonarCloud Configuration Preflight
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          set -euo pipefail
          test -n "${SONAR_TOKEN}" || {
            echo '::error::Missing required repository secret SONAR_TOKEN.'
            exit 1
          }
          test -n "${SONAR_ORGANIZATION}" || {
            echo '::error::Missing required repository variable SONAR_ORGANIZATION.'
            exit 1
          }
          test -n "${SONAR_PROJECT_KEY}" || {
            echo '::error::Missing required repository variable SONAR_PROJECT_KEY.'
            exit 1
          }

      # Escaneo y Quality Gate en SonarQube Cloud
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      - name: Production build
        run: npm run build -- --configuration=production

      - name: Docker build
        run: docker build -t asistencias-uco-frontend-ci .

      - name: Trivy image inventory
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: asistencias-uco-frontend-ci
          scanners: vuln,misconfig,secret
          format: sarif
          output: frontend-trivy-image.sarif
          severity: HIGH,CRITICAL
          exit-code: 0
          ignore-unfixed: false

      - name: Upload Trivy inventories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-trivy-inventories
          path: frontend-trivy-*.sarif
          if-no-files-found: ignore
