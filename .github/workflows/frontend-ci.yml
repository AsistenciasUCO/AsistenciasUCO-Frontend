name: Frontend CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  build-test-verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (headless, with coverage)
        run: npm run test:ci
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Realtime coverage gate
        run: npm run coverage:realtime:check

      # Escaneo y Quality Gate en SonarQube Cloud
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      - name: Production build
        run: npm run build -- --configuration=production

      - name: Docker build
        run: docker build -t asistencias-uco-frontend-ci .
