# Identificación del proyecto en SonarCloud
# sonar.organization and sonar.projectKey are supplied by official CI variables.
# Local analysis must provide them explicitly; no personal organization is a repository source of truth.
sonar.projectName=AsistenciasUCO-Frontend
sonar.projectVersion=1.0.0

# Rutas de código fuente y pruebas
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/*.spec.ts,**/node_modules/**,**/coverage/**,**/environments/**

# Exclusiones de cobertura (modelos, interfaces, DTOs y configuración de arranque sin lógica ejecutable)
sonar.coverage.exclusions=**/*.model.ts,**/*.interface.ts,**/*.dto.ts,**/environments/**,**/main.ts,**/app.config.ts,**/app.routes.ts

# Reporte de cobertura (generado por karma-coverage)
sonar.javascript.lcov.reportPaths=coverage/gestio-asistencia-frontend/lcov.info

# Codificación
sonar.sourceEncoding=UTF-8
