<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Green Rounded Square Background -->
  <rect width="512" height="512" rx="100" fill="#096C38"/>
  
  <!-- White Multi-Point Starburst Background -->
  <g fill="#FFFFFF">
    <!-- North-South-East-West wide points -->
    <polygon points="256,40 286,226 472,256 286,286 256,472 226,286 40,256 226,226"/>
    <!-- Diagonal wide points -->
    <polygon points="256,40 310,202 472,256 310,310 256,472 202,310 40,256 202,202"/>
    <!-- Additional starburst rays -->
    <polygon points="256,70 290,170 386,126 342,222 442,256 342,290 386,386 290,342 256,442 222,342 126,386 170,290 70,256 170,222 126,126 222,170"/>
  </g>
  
  <!-- Central Gold 4-Point Compass Star Overlay -->
  <polygon points="256,25 295,217 487,256 295,295 256,487 217,295 25,256 217,217" fill="#F5B800"/>
</svg>
